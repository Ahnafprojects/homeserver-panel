# Home Server Panel — production stack for the Asus K42F
#
#   docker compose up -d --build
#
# The panel manages Docker on this machine, so it needs the Docker socket.
# It also reads host /proc and /sys to report real CPU, memory and temperature
# rather than the container's own numbers.

services:
  panel:
    build: ./panel
    image: homeserver-panel:latest
    container_name: panel
    restart: unless-stopped
    ports:
      - "8090:8080"          # remove this once Caddy fronts the panel
      # Jalur KHUSUS cloudflared — publish cuma ke 127.0.0.1 (bukan
      # 0.0.0.0), jadi mustahil dijangkau LAN atau internet langsung.
      # Dipakai buat memverifikasi CF-Connecting-IP beneran dari Cloudflare
      # (lihat ipOf() di server.js). Jangan ubah jadi 0.0.0.0 di sini.
      - "127.0.0.1:8091:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/data:/data                  # your files
      - /srv/panel-state:/state          # users, events, settings
      - /srv/stacks:/stacks              # deployed apps
      # HDD eksternal (sama yang dipakai server-backup.timer) — bukan disk
      # internal, biar backup manual dari panel juga selamat kalau SSD utama
      # rusak. manual/ di HDD itu buat backup sekali-jalan dari panel;
      # auto/ (dipakai server-backup.timer, di luar container ini) untuk
      # snapshot harian otomatis — lihat README.txt di root drive backup.
      - /mnt/backup/manual:/backup
      - /srv/caddy:/caddy                # generated Caddyfile
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Read-write disengaja: dipakai Files & Code Editor untuk baca/edit
      # seluruh isi laptop, bukan cuma /srv/data dan /srv/stacks. Panel ini
      # sudah privileged dan punya terminal host lewat nsenter — mount ini
      # tidak menambah privilege baru, cuma jalur GUI ke akses yang sudah ada.
      - /:/host/root
    environment:
      TZ: Asia/Jakarta
      APPS_NETWORK: apps
      CADDY_CONTAINER: caddy
      # Set to 1 ONLY when the panel sits behind a reverse proxy you control.
      # Otherwise anyone can forge X-Forwarded-For and defeat login throttling.
      TRUST_PROXY: "0"
      # Telegram bot for urgent in-app events (terminal opened, sign-ins,
      # uptime alerts, etc). Separate from the OS-level alerts in
      # /etc/server-alerts.conf — set these in a sibling .env file.
      TG_TOKEN: ${TG_TOKEN:-}
      TG_CHAT: ${TG_CHAT:-}
      # OAuth client buat fitur "Connect Google Drive" (Vault & Backups) —
      # dibuat sendiri lewat Google Cloud Console (bukan bawaan rclone),
      # supaya punya jatah API sendiri. Simpan di .env, jangan commit.
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
    pid: host              # needed for the host terminal and power controls
    privileged: true       # needed for nsenter into the host namespace
    networks: [apps]

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks: [apps]

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  apps:
    name: apps
    driver: bridge
